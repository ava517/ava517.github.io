<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>旅遊詢問表單</title>
  <style>
    :root{font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial;}
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;background: #FFF8DC;margin:0;padding:20px}
    .card{background:white;padding:24px;border-radius:12px;box-shadow:0 6px 20px rgba(20,30,60,0.08);width:100%;max-width:520px}
    h1{font-size:20px;margin:0 0 12px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{font-size:13px;color:#333;margin-bottom:6px;display:block}
    input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #e1e6f0;font-size:14px}
    .full{grid-column:1/-1}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
    button{padding:10px 14px;border-radius:10px;border:0;background:#0066ff;color:#fff;font-weight:600;cursor:pointer}
    pre{background:#f0f4ff;padding:12px;border-radius:8px;overflow:auto;font-size:13px}
    .note{font-size:13px;color:#666;margin-bottom:8px}
  </style>
</head>
<body>
  <form action="https://formspree.io/f/mrbonkoz" method="post">
  <form class="card" id="travelForm">
    <h1>旅遊詢問表單</h1>
    <p class="note">請填寫以下資訊，按「送出表單」後相關工作人員會在一至兩天內與您聯繫。</p>

    <div class="grid">
      <div>
        <label for="age">年齡</label>
        <input type="number" id="age" name="age" min="0" max="120" placeholder="例如：28" required>
      </div>

      <div>
        <label for="people">人數</label>
        <input type="number" id="people" name="people" min="1" max="50" placeholder="例如：3" required>
      </div>

      <div class="full">
        <label for="from">出發地</label>
        <input type="text" id="from" name="from" placeholder="例如：台北、台中、高雄" required>
      </div>

      <div>
        <label for="days">預計逗留天數</label>
        <input type="number" id="days" name="days" min="1" max="365" placeholder="例如：7" required>
      </div>

      <div>
        <label for="to">抵達城市</label>
        <input type="text" id="to" name="to" placeholder="例如：洛杉磯、舊金山" required>
      </div>

     <div>
        <label for="from">信箱</label>
        <input type="text" id="from" name="from" placeholder="例如：xxxxx@gmail.com" required>
      </div>

     <div>
        <label for="from">留言</label>
        <input type="text" id="from" name="from" placeholder="旅遊目的 eg.海外參訪、商展、表演、活動賽事" required>
      </div>

    <div class="actions">
      <button type="submit">送出表單</button>
      <button type="reset" style="background:#e6eefc;color:#08306b">重設</button>
    </div>

   
  </form>
  </form>

  <script>
    const form = document.getElementById('travelForm');
    const output = document.getElementById('output');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const obj = {};
      for (const [k,v] of data.entries()) obj[k] = v;
      output.textContent = JSON.stringify(obj, null, 2);
    });
  </script>
</body>
</html>
